<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-label="Tushar Aggarwal">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08070d"/>
      <stop offset="50%" stop-color="#12091c"/>
      <stop offset="100%" stop-color="#08070d"/>
    </linearGradient>
    <linearGradient id="neonGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff2d78"/>
      <stop offset="50%" stop-color="#9d4edd"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8bbd0"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2d1b40" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#dots)"/>

  <!-- Ambient Glow Blobs -->
  <circle cx="250" cy="80" r="140" fill="#ff2d78" opacity="0.12" filter="url(#neonGlow)"/>
  <circle cx="950" cy="180" r="160" fill="#00f0ff" opacity="0.1" filter="url(#neonGlow)"/>
  <circle cx="600" cy="140" r="120" fill="#9d4edd" opacity="0.15" filter="url(#neonGlow)"/>

  <!-- Floating Sparkles -->
  <g opacity="0.7">
    <circle cx="180" cy="70" r="2" fill="#ff70a6">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1020" cy="80" r="2" fill="#00f0ff">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="880" cy="210" r="1.5" fill="#ff70a6">
      <animate attributeName="opacity" values="0.1;0.9;0.1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="320" cy="220" r="2" fill="#9d4edd">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Animated Neon Laser Curve -->
  <path d="M0 225 C350 200, 500 250, 750 215 S1050 205, 1200 225" fill="none" stroke="#2a123d" stroke-width="2"/>
  <path d="M0 225 C350 200, 500 250, 750 215 S1050 205, 1200 225" fill="none" stroke="url(#neonGradient)" stroke-width="2.5" opacity="0.7" filter="url(#neonGlow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-1200" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="stroke-dasharray" values="20 35;60 25;20 35" dur="4.5s" repeatCount="indefinite"/>
  </path>

  <!-- Main Text -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">
    <!-- University Tag -->
    <text x="600" y="68" fill="#a78bfa" font-size="13" font-weight="700" letter-spacing="4">DELHI TECHNOLOGICAL UNIVERSITY • DATA SCIENCE</text>
    
    <!-- Main Name -->
    <text x="600" y="134" fill="url(#textGrad)" font-size="54" font-weight="900" letter-spacing="6" filter="url(#neonGlow)">TUSHAR AGGARWAL</text>
    
    <!-- Philosophy Quote -->
    <text x="600" y="180" fill="#f472b6" font-size="17" font-weight="500" letter-spacing="3">“Whatever will be, will be. The future's not ours to see.”</text>
  </g>

  <!-- Animated Bottom Bar -->
  <g transform="translate(450, 240)">
    <rect x="0" y="0" width="300" height="3.5" rx="2" fill="#201130"/>
    <rect x="0" y="0" width="80" height="3.5" rx="2" fill="url(#neonGradient)" filter="url(#neonGlow)">
      <animate attributeName="x" values="-80;300;-80" dur="2.5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
