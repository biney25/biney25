<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-label="Tushar Aggarwal">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="50%" stop-color="#0e0405"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="crimson" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b0003"/>
      <stop offset="50%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#3b0003"/>
    </linearGradient>
    <linearGradient id="bloodGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff1a1a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#1c0a0c" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#grid)" opacity="0.4"/>

  <!-- Top Ambient Glow -->
  <ellipse cx="600" cy="0" rx="400" ry="90" fill="url(#bloodGlow)"/>

  <!-- Subtle pulse line -->
  <path d="M0 220 C300 200, 500 240, 700 215 S1000 195, 1200 220" fill="none" stroke="#3b0206" stroke-width="1.5" opacity="0.6"/>
  <path d="M0 220 C300 200, 500 240, 700 215 S1000 195, 1200 220" fill="none" stroke="#e53935" stroke-width="2" opacity="0.3" filter="url(#softGlow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="stroke-dasharray" values="15 35;50 25;15 35" dur="4s" repeatCount="indefinite"/>
  </path>

  <!-- Typography -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" text-anchor="middle">
    <text x="600" y="70" fill="#777777" font-size="12" font-weight="600" letter-spacing="4">DELHI TECHNOLOGICAL UNIVERSITY</text>
    <text x="600" y="132" fill="#ffffff" font-size="52" font-weight="800" letter-spacing="6" filter="url(#softGlow)">TUSHAR AGGARWAL</text>
    <text x="600" y="180" fill="#e53935" font-size="17" font-weight="500" letter-spacing="3">“Whatever will be, will be. The future's not ours to see.”</text>
  </g>

  <!-- Bottom pulse slider -->
  <g transform="translate(450, 240)">
    <rect x="0" y="0" width="300" height="3" rx="1.5" fill="#200003"/>
    <rect x="0" y="0" width="80" height="3" rx="1.5" fill="url(#crimson)" filter="url(#softGlow)">
      <animate attributeName="x" values="-80;300;-80" dur="2.4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
