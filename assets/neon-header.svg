<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="Tushar Aggarwal - DTU Data Science">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="50%" stop-color="#0f0406"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="crimson" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4a0000"/>
      <stop offset="50%" stop-color="#ff2b2b"/>
      <stop offset="100%" stop-color="#4a0000"/>
    </linearGradient>
    <linearGradient id="bloodGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff1a1a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4a0000" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#220b0e" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)" opacity="0.45"/>

  <!-- Subtle ambient top red glow -->
  <ellipse cx="600" cy="0" rx="450" ry="120" fill="url(#bloodGlow)" opacity="0.25"/>

  <!-- Animated pulsating signal dots -->
  <g opacity="0.6">
    <circle cx="120" cy="80" r="2.5" fill="#ff3333">
      <animate attributeName="opacity" values="0.1;1;0.1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="90" r="2.5" fill="#ff3333">
      <animate attributeName="opacity" values="1;0.15;1" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="240" r="2" fill="#ff5555">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="230" r="1.5" fill="#ff5555">
      <animate attributeName="opacity" values="0.8;0.1;0.8" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Laser scanning pulse lines -->
  <path d="M0 245 C200 215, 420 270, 600 235 S950 205, 1200 245" fill="none" stroke="#500005" stroke-width="2" opacity="0.6"/>
  <path d="M0 245 C200 215, 420 270, 600 235 S950 205, 1200 245" fill="none" stroke="#ff2b2b" stroke-width="2.5" opacity="0.3" filter="url(#softGlow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-1200" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="stroke-dasharray" values="20 40;60 30;20 40" dur="4.5s" repeatCount="indefinite"/>
  </path>

  <!-- Main Text Hierarchy -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" text-anchor="middle">
    <!-- Tagline Top -->
    <text x="600" y="72" fill="#888888" font-size="13" font-weight="600" letter-spacing="4">DELHI TECHNOLOGICAL UNIVERSITY • DATA SCIENCE</text>
    
    <!-- Name with glow -->
    <text x="600" y="132" fill="#ffffff" font-size="54" font-weight="800" letter-spacing="6" filter="url(#softGlow)">TUSHAR AGGARWAL</text>
    
    <!-- Philosophical subline -->
    <text x="600" y="178" fill="#ff3b3b" font-size="18" font-weight="600" letter-spacing="3.5">“Whatever will be, will be. The future's not ours to see.”</text>
    
    <!-- Tags -->
    <text x="600" y="218" fill="#a0a0a0" font-size="13.5" font-weight="500" letter-spacing="2.5">STUDENT • PHOTOGRAPHY • INFP-T • BUILDING QUIETLY</text>
  </g>

  <!-- Bottom animated progress / scanner track -->
  <g transform="translate(425, 275)">
    <rect x="0" y="0" width="350" height="3.5" rx="2" fill="#2d0004"/>
    <rect x="0" y="0" width="90" height="3.5" rx="2" fill="url(#crimson)" filter="url(#glow)">
      <animate attributeName="x" values="-90;350;-90" dur="2.6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
